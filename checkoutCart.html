<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="checkout.css">
    <title>Checkout</title>
</head>
<body>
    <header class="home">
        <div>
            <h1 class="main-title" style="margin-left: 200px;">Rays of Modesty </h1>
        </div>

        <div class="links" style="margin-right: 100px;">
            <div class="link">login</div>
            <a class="link" href="checkoutCart.html"><img class="icon-link" src="images/icons/shopping-basket.jpg" alt="my-shopping-cart"></a>
        </div>
    </header>
    
    <div class="card">
        <div class="item">
            <p>Bag</p>
                <div class="card-info">
                    <div class="pic-box">
                        <img class="pic" src="images/pics/black-hijab.webp" alt="Black hijab">
                    </div>
                    <div>
                        <p>Hijab : R250</p>
                        <p>Black</p>
                    </div>
                </div>
                <div class="buttons">
                    <div class="shopping-buttons">
                    <button class="rm-button">bin</button>
                    <p>1</p>
                    <button class="add-button">+</button>
                    </div>
                    <div class="fav-box">
                        <button class="fav-button">❤️</button>
                    </div>
                </div>
                
        </div>

        <div class="pricing">
            <p style="font-size: larger; font-weight: 800;">
                Summary
            </p>

            <div style="padding-bottom: 10px;">
                Subtotal -
            </div>
            <div style="padding-bottom: 10px;">
                Estimated Delivery & Handling -
            </div>
            <div style="border-top: solid grey 1px; border-bottom: solid grey 1px; padding: 10px 0px;">
                Total -
            </div>
        </div>
    </div>
   
</body>
</html>
